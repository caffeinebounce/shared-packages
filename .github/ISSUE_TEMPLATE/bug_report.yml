name: Bug report
description: Report a reproducible package, build, or documentation bug.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, private data, or security-sensitive details here. For suspected vulnerabilities, use the security reporting path in `docs/SECURITY.md`.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "@caffeinebounce/ui"
        - "@caffeinebounce/identity"
        - "@caffeinebounce/email"
        - "@caffeinebounce/ai-assistant"
        - "@caffeinebounce/logger"
        - "@caffeinebounce/shared-utils"
        - "@caffeinebounce/commerce"
        - "@caffeinebounce/notifications"
        - CaffeineNativeUI
        - Build or release workflow
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version or commit
      placeholder: "@caffeinebounce/ui@0.61.0 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What happened?
      description: Describe the current behavior and why it looks wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reproduction you can, including commands, imports, props, or environment details.
      placeholder: |
        1. Install ...
        2. Import ...
        3. Run ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node, Yarn, React, Next.js, Swift, browser, or OS versions where relevant.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I removed secrets, tokens, credentials, and private data from this issue.
          required: true
        - label: This is not a suspected security vulnerability.
          required: true
