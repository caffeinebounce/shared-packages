name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 25
          package-manager-cache: false
          registry-url: "https://npm.pkg.github.com"
          scope: "@caffeinebounce"

      - name: Enable Corepack
        run: corepack enable && corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Consumer package smoke
        run: yarn test:consumer-smoke

      - name: UI entrypoint sizes
        run: yarn size:ui

      - name: Validate package contracts
        run: yarn validate:packages

      - name: Version or publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn version-packages && yarn install
          publish: yarn release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          YARN_NPM_AUTH_TOKEN: ${{ github.token }}

      - name: Check consumer dispatch configuration
        id: consumer_dispatch_config
        run: |
          if [ -n "${GH_PAT}" ] && [ -n "${CONSUMER_REPOSITORY}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          CONSUMER_REPOSITORY: ${{ vars.SHARED_PACKAGES_CONSUMER_REPOSITORY }}

      - name: Notify consumer about published packages
        if: steps.changesets.outputs.published == 'true' && steps.consumer_dispatch_config.outputs.available == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GH_PAT }}
          repository: ${{ vars.SHARED_PACKAGES_CONSUMER_REPOSITORY }}
          event-type: update-shared-packages
          client-payload: |
            {
              "source": "shared-packages",
              "sha": "${{ github.sha }}",
              "packages": ${{ steps.changesets.outputs.publishedPackages }}
            }
