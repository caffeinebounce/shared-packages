# .github/workflows/dependency-review.yml
#
# Opinionated Dependency Review workflow.
# Runs on every PR and comments on vulnerable or license-problematic new dependencies.
#
# This is a key part of the GitHub-centric security posture.
# See: scripts/agents/STANDARDS.md §9

name: "Dependency Review"

on:
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail the check if high or critical vulnerabilities are introduced
          fail-on-severity: high

          # You can also enforce license allow/deny lists here when you have one
          # deny-licenses: GPL-3.0, AGPL-3.0, LGPL-3.0

          # Comment on the PR with details (very useful)
          comment-summary-in-pr: always
