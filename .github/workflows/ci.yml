name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          package-manager-cache: false
          registry-url: 'https://npm.pkg.github.com'
          scope: '@caffeinebounce'

      - name: Enable Corepack
        run: corepack enable && corepack prepare yarn@4.12.0 --activate

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder 2>/dev/null | tail -n1)" >> $GITHUB_OUTPUT

      - name: Restore yarn cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: yarn-cache-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            yarn-cache-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check changelog discipline
        if: github.event_name == 'pull_request'
        run: yarn check:changelog

      - name: Root lint
        if: github.event_name == 'pull_request'
        run: yarn format:check

      - name: Lint
        if: github.event_name == 'pull_request'
        run: timeout 5m yarn lint

      - name: Typecheck
        if: github.event_name == 'pull_request'
        run: timeout 5m yarn typecheck

      - name: Test
        if: github.event_name == 'pull_request'
        run: timeout 5m yarn test

      - name: Build
        if: github.event_name == 'pull_request'
        run: timeout 10m yarn build

      - name: Lint
        if: github.event_name == 'push'
        run: yarn lint

      - name: Typecheck
        if: github.event_name == 'push'
        run: yarn typecheck

      - name: Test
        if: github.event_name == 'push'
        run: yarn test

      - name: Build
        if: github.event_name == 'push'
        run: yarn build

      - name: Consumer package smoke
        if: github.event_name == 'pull_request'
        run: timeout 5m yarn test:consumer-smoke

      - name: Consumer package smoke
        if: github.event_name == 'push'
        run: yarn test:consumer-smoke

      - name: UI entrypoint sizes
        run: yarn size:ui

      - name: Validate package contracts
        run: yarn validate:packages

  swift:
    runs-on: macos-14
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test Swift package
        run: swift test
