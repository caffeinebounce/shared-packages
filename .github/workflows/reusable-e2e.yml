# =============================================================================
# Reusable E2E Workflow
# =============================================================================
#
# Features:
# - Playwright browser caching
# - Download build artifacts from build job
# - Run E2E smoke tests
# - Upload test results on failure
#
# Usage in consuming repos:
#
#   jobs:
#     e2e:
#       needs: build
#       uses: caffeinebounce/shared-packages/.github/workflows/reusable-e2e.yml@main
#       with:
#         playwright-browser: chromium
#       secrets:
#         GH_PAT: ${{ secrets.GH_PAT }}
#         TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
#         TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
#
# =============================================================================

name: Reusable E2E

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        default: '24'
        type: string
      yarn-version:
        description: 'Yarn version'
        required: false
        default: '4.12.0'
        type: string
      playwright-browser:
        description: 'Playwright browser to install'
        required: false
        default: 'chromium'
        type: string
      web-app-path:
        description: 'Path to web app'
        required: false
        default: 'apps/web'
        type: string
      test-timeout-minutes:
        description: 'E2E test timeout in minutes'
        required: false
        default: 5
        type: number
    secrets:
      GH_PAT:
        description: 'GitHub PAT for packages auth'
        required: false
      TEST_USER_EMAIL:
        description: 'E2E test user email'
        required: false
      TEST_USER_PASSWORD:
        description: 'E2E test user password'
        required: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Job timeout = test timeout + 10 min buffer for setup/teardown
    timeout-minutes: ${{ inputs.test-timeout-minutes + 10 }}

    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.GH_PAT || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable Corepack
        run: corepack enable && corepack prepare yarn@${{ inputs.yarn-version }} --activate

      - name: Configure GitHub Packages auth
        run: |
          echo 'npmScopes:' > .yarnrc.local.yml
          echo '  caffeinebounce:' >> .yarnrc.local.yml
          echo '    npmAlwaysAuth: true' >> .yarnrc.local.yml
          echo '    npmRegistryServer: "https://npm.pkg.github.com"' >> .yarnrc.local.yml
          echo "    npmAuthToken: \"${{ secrets.GH_PAT || github.token }}\"" >> .yarnrc.local.yml

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder | tail -n1)" >> $GITHUB_OUTPUT

      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: yarn-cache-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            yarn-cache-${{ runner.os }}-

      # Note: We rely on yarn cache for dependency restoration
      # node_modules artifacts are not uploaded by the build job to save storage
      - name: Install Dependencies
        run: yarn install --immutable
        timeout-minutes: 5

      - name: Restore Playwright browsers
        id: restore-playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-${{ inputs.playwright-browser }}
          key: playwright-browsers-${{ runner.os }}-${{ inputs.playwright-browser }}-${{ hashFiles('**/package.json', '**/yarn.lock') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-${{ inputs.playwright-browser }}-
            playwright-browsers-${{ runner.os }}-

      - name: Download web build artifact
        id: download-web-build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-build
          path: ./

      - name: Extract web build artifact
        id: extract-web
        run: |
          if [ -f "./web-build.tgz" ]; then
            echo "Found web-build.tgz; extracting"
            mkdir -p ${{ inputs.web-app-path }}
            tar -xzf web-build.tgz -C ${{ inputs.web-app-path }}
            echo "extracted=true" >> $GITHUB_OUTPUT
          else
            echo "No tarball artifact present"
            echo "extracted=false" >> $GITHUB_OUTPUT
          fi

      - name: Build web (fallback)
        if: steps.extract-web.outputs.extracted != 'true'
        run: |
          echo "Build artifact not available; running build"
          yarn workspace web build
        timeout-minutes: 20
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Placeholder Supabase values for CI
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SECRET_KEY: placeholder-secret-key-for-ci  # pragma: allowlist secret

      - name: Install Playwright browsers
        if: steps.restore-playwright.outputs.cache-hit != 'true'
        run: yarn workspace web exec playwright install ${{ inputs.playwright-browser }} --with-deps

      - name: Run E2E tests
        run: yarn workspace web test:e2e
        timeout-minutes: ${{ inputs.test-timeout-minutes }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: true
          # Placeholder Supabase values
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SECRET_KEY: placeholder-secret-key-for-ci  # pragma: allowlist secret
          # E2E test credentials
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Save Playwright browsers cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-${{ inputs.playwright-browser }}
          key: playwright-browsers-${{ runner.os }}-${{ inputs.playwright-browser }}-${{ hashFiles('**/package.json', '**/yarn.lock') }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: playwright-report
          path: ${{ inputs.web-app-path }}/playwright-report/**
          if-no-files-found: warn
          retention-days: 3
